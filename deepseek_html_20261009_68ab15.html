<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码扫描器</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    video { width: 100%; max-width: 640px; border: 2px solid #333; border-radius: 8px; }
    #result { margin-top: 20px; font-size: 1.4em; font-weight: bold; color: #0a0; word-break: break-all; }
    button { margin-top: 15px; padding: 10px 20px; font-size: 1em; cursor: pointer; }
  </style>
</head>
<body>
  <h1>二维码扫描</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" hidden></canvas>
  <div id="result">等待扫描...</div>
  <button id="rescan">重新扫描</button>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultDiv = document.getElementById('result');
    let scanning = true;
    let stream = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();
        requestAnimationFrame(tick);
      } catch (err) {
        resultDiv.textContent = '无法访问摄像头：' + err.message;
      }
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });
        if (code) {
          scanning = false;
          resultDiv.textContent = '扫描结果：' + code.data;
        }
      }
      if (scanning) requestAnimationFrame(tick);
    }

    document.getElementById('rescan').addEventListener('click', () => {
      scanning = true;
      resultDiv.textContent = '等待扫描...';
      requestAnimationFrame(tick);
    });

    startCamera();
  </script>
</body>
</html>
